<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google</title>
  <style>
    :root {
      --google-blue: #0b57d0;
      --google-blue-hover: #0842a0;
      --google-gray: #5f6368;
      --google-light-gray: #f0f4f9;
      --google-border: #e3e3e3;
      --google-dark: #1f1f1f;
      --font-family: "Google Sans", Roboto, Arial, sans-serif;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background-color: var(--google-light-gray);
      color: var(--google-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      border-radius: 28px;
      padding: 40px;
      width: min(100%, 1040px);
      min-height: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .left-pane {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 10px;
    }

    .google-logo {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 36px;
      font-weight: 400;
      margin: 0 0 12px;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .subhead {
      font-size: 16px;
      color: var(--google-dark);
      margin: 0;
      line-height: 1.5;
    }

    .subhead a {
      color: var(--google-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .right-pane {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 10px;
    }

    .account-chooser-list {
      border: 1px solid var(--google-border);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      margin-top: 10px;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--google-border);
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .account-item:last-child {
      border-bottom: none;
    }

    .account-item:hover {
      background-color: #f8fafd;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #dfebfa;
      color: #0b57d0;
      font-weight: 600;
      font-size: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-info {
      flex-grow: 1;
    }

    .account-name {
      font-size: 15px;
      font-weight: 500;
      margin: 0;
      color: var(--google-dark);
    }

    .account-email {
      font-size: 13px;
      color: var(--google-gray);
      margin: 2px 0 0;
    }

    .sign-in-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--google-border);
      display: grid;
      place-items: center;
      color: var(--google-blue);
    }

    .use-another-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--google-blue);
    }

    /* Manual Login Form Pane */
    .manual-login-form {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .input-field {
      width: 100%;
      height: 56px;
      position: relative;
      border: 1px solid var(--google-gray);
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .input-field input {
      width: 100%;
      height: 100%;
      background: none;
      border: none;
      outline: none;
      padding: 20px 16px 6px;
      font-size: 16px;
      color: var(--google-dark);
    }

    .input-field label {
      position: absolute;
      left: 16px;
      top: 18px;
      color: var(--google-gray);
      font-size: 16px;
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .input-field input:focus ~ label,
    .input-field input:not(:placeholder-shown) ~ label {
      top: 6px;
      font-size: 12px;
      color: var(--google-blue);
    }

    .input-field input:focus {
      border: 2px solid var(--google-blue);
      border-radius: 4px;
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--google-blue);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 4px;
    }

    .text-btn:hover {
      background-color: #f8fafd;
    }

    .action-btn {
      background-color: var(--google-blue);
      color: #ffffff;
      border: none;
      border-radius: 100px;
      padding: 10px 24px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .action-btn:hover {
      background-color: var(--google-blue-hover);
    }

    .error-msg {
      color: #b00020;
      font-size: 12px;
      margin-top: -4px;
      display: none;
    }

    /* Footer styling */
    .footer-bar {
      position: absolute;
      bottom: 24px;
      width: min(100%, 1040px);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--google-gray);
      padding: 0 40px;
    }

    .footer-bar a {
      color: var(--google-gray);
      text-decoration: none;
      margin-left: 16px;
    }

    .footer-bar a:hover {
      color: var(--google-dark);
    }

    .lang-selector {
      cursor: pointer;
    }

    @media (max-width: 840px) {
      .container {
        grid-template-columns: 1fr;
        padding: 30px;
        min-height: auto;
        border-radius: 12px;
      }
      .left-pane {
        align-items: center;
        text-align: center;
      }
      h1 {
        font-size: 28px;
      }
      .footer-bar {
        position: relative;
        bottom: auto;
        margin-top: 30px;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left-pane">
      <div class="google-logo">
        <svg viewBox="0 0 24 24" width="40" height="40">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </div>
      <h1 id="headline">Choose an account</h1>
      <p class="subhead" id="subhead">to continue to <a id="domain" href="#">gbex1.netlify.app</a></p>
    </div>
    
    <div class="right-pane">
      <!-- Account Chooser List -->
      <div id="accountChooser" class="account-chooser-list">
        <!-- Gourav Madaan Active Account -->
        <button class="account-item" onclick="selectAccount('madaang47@gmail.com', 'Gourav Madaan')">
          <div class="avatar-wrapper">
            <div class="avatar">
              <!-- Hardcoded nice letters avatar -->
              GM
            </div>
          </div>
          <div class="account-info">
            <p class="account-name">Gourav Madaan</p>
            <p class="account-email">madaang47@gmail.com</p>
          </div>
        </button>
        
        <!-- Use another account item -->
        <button class="account-item" onclick="switchToManual()">
          <div class="sign-in-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <div class="account-info">
            <span class="use-another-text">Use another account</span>
          </div>
        </button>
      </div>
      
      <!-- Manual Form Login -->
      <div id="manualLogin" class="manual-login-form">
        <div class="input-field">
          <input type="email" id="email" placeholder=" " required>
          <label for="email">Email or phone</label>
        </div>
        <div class="input-field">
          <input type="password" id="password" placeholder=" " required>
          <label for="password">Password</label>
        </div>
        
        <p id="errorBox" class="error-msg"></p>
        
        <div class="btn-row">
          <button class="text-btn" onclick="switchToChooser()">Back to chooser</button>
          <button class="action-btn" onclick="submitManual()">Next</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="lang-selector">
      English (United States) &#9662;
    </div>
    <div>
      <a href="#" target="_blank">Help</a>
      <a href="#" target="_blank">Privacy</a>
      <a href="#" target="_blank">Terms</a>
    </div>
  </div>

  <script>
    // Dynamically retrieve parent host domain name
    const parentHost = window.opener ? window.opener.location.host : "gbex1.netlify.app";
    document.getElementById("domain").textContent = parentHost;
    
    // Read authMode (role) passed via URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get("role") || "rider";

    // Display real Google consent popup button if Client ID is configured in parent config.js
    const googleClientId = window.opener && window.opener.GMK_CONFIG?.googleClientId;
    if (googleClientId) {
      const consentBtn = document.createElement("button");
      consentBtn.className = "action-btn";
      consentBtn.style.backgroundColor = "transparent";
      consentBtn.style.color = "var(--google-blue)";
      consentBtn.style.border = "1px solid var(--google-border)";
      consentBtn.style.marginBottom = "15px";
      consentBtn.style.width = "100%";
      consentBtn.style.borderRadius = "100px";
      consentBtn.style.padding = "12px";
      consentBtn.style.cursor = "pointer";
      consentBtn.textContent = "Sign in using official Google Consent Popup";
      consentBtn.onclick = () => {
        window.opener.startGoogleOAuth();
        window.close();
      };
      
      const manualForm = document.getElementById("manualLogin");
      manualForm.insertBefore(consentBtn, manualForm.firstChild);
    }

    function selectAccount(email, name) {
      if (window.opener) {
        window.opener.postMessage({
          type: "GOOGLE_SIGNIN_SUCCESS",
          email: email.toLowerCase(),
          name: name,
          password: "GoogleLoginOAuthSecret"
        }, window.location.origin);
        window.close();
      }
    }

    function switchToManual() {
      document.getElementById("headline").textContent = "Sign in";
      document.getElementById("subhead").innerHTML = `to continue to <a id="domain-sub" href="#">${parentHost}</a>`;
      document.getElementById("accountChooser").style.display = "none";
      document.getElementById("manualLogin").style.display = "flex";
      document.getElementById("email").focus();
    }

    function switchToChooser() {
      document.getElementById("headline").textContent = "Choose an account";
      document.getElementById("subhead").innerHTML = `to continue to <a id="domain-sub" href="#">${parentHost}</a>`;
      document.getElementById("accountChooser").style.display = "block";
      document.getElementById("manualLogin").style.display = "none";
      document.getElementById("errorBox").style.display = "none";
    }

    function submitManual() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox");

      if (!email || !password) {
        errorBox.textContent = "Enter an email and password";
        errorBox.style.display = "block";
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorBox.textContent = "Enter a valid email address";
        errorBox.style.display = "block";
        return;
      }

      if (window.opener) {
        window.opener.postMessage({
          type: "GOOGLE_SIGNIN_SUCCESS",
          email: email.toLowerCase(),
          name: email.split("@")[0],
          password: password
        }, window.location.origin);
        window.close();
      }
    }
  </script>
</body>
</html>
