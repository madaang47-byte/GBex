<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Apple ID</title>
  <style>
    :root {
      --apple-black: #000000;
      --apple-dark-gray: #1d1d1f;
      --apple-light-gray: #f5f5f7;
      --apple-blue: #0066cc;
      --border-color: #d2d2d7;
      --text-color: #1d1d1f;
      --text-muted: #86868b;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--apple-light-gray);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 44px 36px;
      text-align: center;
    }

    .apple-logo {
      font-size: 56px;
      margin-bottom: 12px;
      color: var(--apple-black);
      line-height: 1;
    }

    h2 {
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }

    p.desc {
      font-size: 15px;
      color: var(--text-muted);
      margin: 0 0 28px;
    }

    .account-picker {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      text-align: left;
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .account-row:last-child {
      border-bottom: none;
    }

    .account-row:hover {
      background-color: #f9f9fb;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 16px;
      border: 1px solid var(--border-color);
    }

    .info {
      flex-grow: 1;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
    }

    .email {
      font-size: 13.5px;
      color: var(--text-muted);
      margin: 2px 0 0;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 300;
    }

    .use-another-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--apple-blue);
    }

    .form-wrapper {
      display: none;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--apple-black);
    }

    .error-notice {
      display: none;
      font-size: 13px;
      color: #df2c2c;
      background: #fdf2f2;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      min-height: 44px;
      background: var(--apple-black);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--apple-dark-gray);
    }

    .btn.secondary {
      background: transparent;
      color: var(--apple-blue);
      margin-top: 10px;
    }

    .btn.secondary:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="apple-logo"></div>
    <h2 id="title">Sign in with Apple ID</h2>
    <p class="desc" id="desc">Use your Apple ID to sign in to GBEX.</p>
    
    <div id="errorBox" class="error-notice"></div>
    
    <!-- Account Chooser List -->
    <div id="chooserList" class="account-picker">
      <!-- Dynamic list populated on load from device cache -->
      
      <!-- Use another account -->
      <button class="account-row" onclick="showForm()">
        <div class="avatar" style="border-style: dashed; background: none;">+</div>
        <div class="info">
          <span class="use-another-text">Use a different Apple ID</span>
        </div>
        <div class="chevron">›</div>
      </button>
    </div>

    <!-- Manual input form -->
    <div id="manualForm" class="form-wrapper">
      <div class="field">
        <label>Apple ID</label>
        <input id="appleEmail" type="email" placeholder="email@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="applePassword" type="password" placeholder="Password" required>
      </div>
      
      <button class="btn" onclick="submitAppleAuth()">Sign In</button>
      <button class="btn secondary" onclick="showChooser()">Back</button>
    </div>

    <button class="btn secondary" onclick="window.close()" style="margin-top:14px; font-size:14px;">Cancel</button>
  </div>

  <script>
    const parentHost = window.opener ? window.opener.location.host : "gbex1.netlify.app";
    document.getElementById("desc").textContent = "Use your Apple ID to sign in to " + parentHost + ".";

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get("role") || "rider";

    window.onload = function() {
      let matchingUsers = [];
      try {
        const saved = localStorage.getItem("gbex-device-accounts");
        if (saved) {
          const list = JSON.parse(saved);
          matchingUsers = list.filter(acc => acc.provider === "Apple ID" && acc.role === role);
        }
      } catch (e) {
        console.warn("Could not read device accounts from localStorage", e);
      }

      if (matchingUsers.length === 0) {
        // No registered users on this browser, go to form directly
        showForm();
      } else {
        const chooser = document.getElementById("chooserList");
        const useAnotherBtn = chooser.querySelector("button:last-child");

        // Clear any older dynamic list items
        const oldRows = chooser.querySelectorAll(".dynamic-account-row");
        oldRows.forEach(row => row.remove());

        matchingUsers.forEach(user => {
          const btn = document.createElement("button");
          btn.className = "account-row dynamic-account-row";
          
          const initials = user.name.split(" ").map(n => n[0]).join("").toUpperCase().substring(0, 2) || "U";
          
          btn.innerHTML = `
            <div class="avatar">${initials}</div>
            <div class="info">
              <p class="name">${user.name}</p>
              <p class="email">${user.email}</p>
            </div>
            <div class="chevron">›</div>
          `;
          btn.onclick = () => selectAppleAccount(user.email, user.name);
          chooser.insertBefore(btn, useAnotherBtn);
        });
      }
    };

    function selectAppleAccount(email, name) {
      if (window.opener) {
        window.opener.postMessage({
          type: "APPLE_SIGNIN_SUCCESS",
          email: email.toLowerCase(),
          name: name,
          password: "AppleLoginOAuthSecret"
        }, window.location.origin);
        window.close();
      }
    }

    function showForm() {
      document.getElementById("chooserList").style.display = "none";
      document.getElementById("manualForm").style.display = "flex";
      document.getElementById("appleEmail").focus();
    }

    function showChooser() {
      document.getElementById("chooserList").style.display = "block";
      document.getElementById("manualForm").style.display = "none";
      document.getElementById("errorBox").style.display = "none";
    }

    function submitAppleAuth() {
      const email = document.getElementById("appleEmail").value.trim();
      const password = document.getElementById("applePassword").value;
      const errorBox = document.getElementById("errorBox");

      if (!email || !password) {
        errorBox.textContent = "Please fill in all fields.";
        errorBox.style.display = "block";
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorBox.textContent = "Please enter a valid email address.";
        errorBox.style.display = "block";
        return;
      }

      if (window.opener) {
        // Save to device account cache
        try {
          const deviceCacheKey = "gbex-device-accounts";
          let deviceAccounts = JSON.parse(localStorage.getItem(deviceCacheKey) || "[]");
          deviceAccounts = deviceAccounts.filter(acc => acc.email !== email.toLowerCase() || acc.role !== role);
          deviceAccounts.push({ email: email.toLowerCase(), name: email.split("@")[0], provider: "Apple ID", role: role });
          localStorage.setItem(deviceCacheKey, JSON.stringify(deviceAccounts));
        } catch (e) {}

        window.opener.postMessage({
          type: "APPLE_SIGNIN_SUCCESS",
          email: email.toLowerCase(),
          password: password,
          name: email.split("@")[0]
        }, window.location.origin);
        window.close();
      }
    }
  </script>
</body>
</html>
