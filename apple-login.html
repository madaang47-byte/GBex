<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Apple ID</title>
  <style>
    :root {
      --apple-black: #000000;
      --apple-dark-gray: #1d1d1f;
      --apple-light-gray: #f5f5f7;
      --apple-blue: #0066cc;
      --border-color: #d2d2d7;
      --text-color: #1d1d1f;
      --text-muted: #86868b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--apple-light-gray);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 36px 24px;
      text-align: center;
    }
    .apple-logo {
      font-size: 40px;
      margin-bottom: 16px;
      color: var(--apple-black);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p.desc {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 24px;
    }
    .field {
      margin-bottom: 16px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--apple-black);
    }
    .error-notice {
      display: none;
      font-size: 13px;
      color: #df2c2c;
      background: #fdf2f2;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      text-align: left;
    }
    .error-notice.show {
      display: block;
    }
    .btn {
      width: 100%;
      min-height: 42px;
      background: var(--apple-black);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: var(--apple-dark-gray);
    }
    .btn.secondary {
      background: transparent;
      color: var(--apple-blue);
      margin-top: 8px;
    }
    .btn.secondary:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="apple-logo"></div>
    <h2>Sign in with Apple ID</h2>
    <p class="desc">Use your Apple ID to sign in to GBEX.</p>
    
    <div id="errorBox" class="error-notice"></div>
    
    <div class="field">
      <label>Apple ID</label>
      <input id="appleEmail" type="email" placeholder="email@example.com" required>
    </div>
    
    <div class="field">
      <label>Password</label>
      <input id="applePassword" type="password" placeholder="Password" required>
    </div>
    
    <button class="btn" onclick="submitAppleAuth()">Sign In</button>
    <button class="btn secondary" onclick="window.close()">Cancel</button>
  </div>

  <script>
    function submitAppleAuth() {
      const email = document.getElementById("appleEmail").value.trim();
      const password = document.getElementById("applePassword").value;
      const errorBox = document.getElementById("errorBox");

      if (!email || !password) {
        errorBox.textContent = "Please fill in all fields.";
        errorBox.classList.add("show");
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorBox.textContent = "Please enter a valid email address.";
        errorBox.classList.add("show");
        return;
      }

      // Send the data back to the parent window
      if (window.opener) {
        window.opener.postMessage({
          type: "APPLE_SIGNIN_SUCCESS",
          email: email.toLowerCase(),
          password: password,
          name: email.split("@")[0]
        }, window.location.origin);
        window.close();
      }
    }
  </script>
</body>
</html>
