<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --brand: #0c7c59;
        --brand-dark: #07583f;
        --ink: #17211b;
        --muted: #5b6961;
        --line: #dce5dc;
        --paper: #f7faf4;
        --white: #ffffff;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        width: 300px;
        background: linear-gradient(135deg, #eef7ee 0%, #edf3f7 100%);
        color: var(--ink);
      }
      .card {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(8px);
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
        color: var(--brand-dark);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo-pill {
        background: var(--brand);
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
      }
      p {
        margin: 0 0 16px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 38px;
        background: var(--brand);
        color: white;
        border: 0;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: var(--brand-dark);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(12, 124, 89, 0.2);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        background: var(--line);
        color: var(--muted);
        cursor: not-allowed;
      }
      .status {
        margin-top: 14px;
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        display: none;
      }
      .status.info {
        display: block;
        background: #e1f5fe;
        color: #0277bd;
        border: 1px solid #b3e5fc;
      }
      .status.success {
        display: block;
        background: #e8f5e9;
        color: #2e7d32;
        border: 1px solid #c8e6c9;
      }
      .status.error {
        display: block;
        background: #ffebee;
        color: #c62828;
        border: 1px solid #ffcdd2;
      }
      .footer-info {
        margin-top: 12px;
        font-size: 10px;
        text-align: center;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2><span class="logo-pill">GBEX</span> Ekart Sync</h2>
      <p>Please navigate to the Ekart active jobsheet page and click the button below to sync active jobsheets.</p>
      
      <button id="syncBtn" class="btn">Sync Active Jobsheets</button>
      
      <div id="statusBox" class="status"></div>
      
      <div class="footer-info">
        Connected to GBEX Sheets API
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
